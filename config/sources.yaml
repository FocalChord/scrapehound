# A source = type (adapter) + bot (routing) + notify (mode) + derive (compute
# attrs) + filter (rule predicate). Adapter-specific keys (base_url, url, search,
# prefilter, selectors, ...) are passed straight to the adapter.
#
# All "New Balance 4E shoes" domain knowledge lives in the three anchors below as
# data — the adapters and core know nothing about brands, widths, or sizes.

_shoe_prefilter: &shoe_prefilter        # cheap fetch-time pruning (AND of ORs)
  - [new balance]
  - ["4e", "x-wide", "x wide", "extra wide", "extra-wide"]

_shoe_derive: &shoe_derive
  brand: {from: title, match: [New Balance, Asics, Brooks, Saucony, Hoka, Mizuno]}
  width: {from: title, regex: '\b([2468]E)\b', upper: true,
          fallbacks: {"x-wide": "4E", "x wide": "4E", "extra wide": "4E", "extra-wide": "4E"}}
  sizes_in_stock: {from_variants: Size}

_shoe_filter: &shoe_filter
  - {attr: brand, op: eq, value: New Balance}
  - {field: title, op: not_contains,
     value: [work boot, composite toe, steel toe, steel cap, safety, gumboot,
             women, womens, wmns, kids, junior, girl]}
  - {attr: width, op: in, value: ["4E"]}
  - {attr: sizes_in_stock, op: intersects, value: [10, 10.5]}

sources:
  athletes_foot:
    type: magento_graphql
    bot: shoes
    notify: price_drop
    graphql_url: "https://www.theathletesfoot.com.au/graphql"
    base_url: "https://www.theathletesfoot.com.au"
    store: au
    search: new balance 4e
    prefilter: *shoe_prefilter
    derive: *shoe_derive
    filter: *shoe_filter

  active_feet:
    type: shopify
    bot: shoes
    notify: price_drop
    base_url: "https://activefeet.com.au"
    prefilter: *shoe_prefilter
    derive: *shoe_derive
    filter: *shoe_filter

  the_running_company:
    type: shopify
    bot: shoes
    notify: price_drop
    base_url: "https://shop.therunningcompany.com.au"
    prefilter: *shoe_prefilter
    derive: *shoe_derive
    filter: *shoe_filter

  brand_house_direct:
    type: shopify
    bot: shoes
    notify: price_drop
    fetch: browser
    base_url: "https://www.brandhousedirect.com.au"
    prefilter: *shoe_prefilter
    derive: *shoe_derive
    filter: *shoe_filter

  rebel:
    type: jsonld                    # generic schema.org adapter (any such site)
    bot: shoes
    notify: price_drop
    base_url: "https://www.rebelsport.com.au"
    search: new balance 4e
    link_regex: "/p/(new-balance-[a-z0-9-]*4e[a-z0-9-]*-[A-Z0-9]+)\\.html"
    derive: *shoe_derive
    filter: *shoe_filter

  newbalance_au:
    type: browser
    bot: shoes
    notify: price_drop
    url: "https://www.newbalance.com.au/men/shoes/running/?prefn1=mensFootwearSize&prefv1=10%7C10.5&prefn2=width&prefv2=X-Wide%20%284E%29"
    channel: chrome
    headless: false
    warm_url: "https://www.newbalance.com.au/"
    wait_for: ".product-tile"
    block_text: "Something went wrong"
    selectors:
      container: ".product-tile"
      title: ".pdp-link a"
      price: ".price .sales span[content]@content"
      was_price: ".strike-through .value@content"
      url: ".pdp-link a@href"
      image: ".tile-image img@src"
    derive:                               # NB has no per-size variants on the PLP;
      brand: {const: New Balance}         # the faceted URL guarantees the criteria
      width: {const: "4E"}
      sizes_in_stock: {const: [10, 10.5]}
    filter: *shoe_filter

  # --- Apple Mac Studio: alert when lead time moves or pickup opens at Highpoint ---
  apple_mac_studio:
    type: apple
    bot: apple
    alert: false                    # tracked on the dashboard, but no Telegram alerts
    notify: changes
    watch: [pickup, ships]          # alert on availability/lead-time changes
    region: au
    store: R504                     # Apple Highpoint, Melbourne
    location: "3032"
    parts: ["MU963X/A", "MU973X/A"]   # M4 Max + M3 Ultra Mac Studio (base configs)

  # --- Apple Certified Refurbished Macs: now just a generic embedded_json config ---
  apple_refurb_mac:
    type: embedded_json           # no Apple-specific code; the page embeds a JSON list
    bot: apple
    dashboard: false              # tracked, but hidden from the public dashboard
    alert: false                  # tracked on the dashboard, but no Telegram alerts
    notify: changes               # new (in stock) / removed (sold) / price
    url: "https://www.apple.com/au/shop/refurbished/mac"
    base_url: "https://www.apple.com"
    key: tiles
    map: &arefmap
      id: partNumber
      title: title
      price: price.currentPrice.raw_amount
      url: productDetailsUrl
      image: image.sources.0.srcSet
    # filter: [{field: title, op: contains_any, value: [Studio, Ultra]}]   # optional

  apple_refurb_homepod:
    type: embedded_json
    bot: apple
    notify: changes
    url: "https://www.apple.com/au/shop/refurbished/homepod"
    base_url: "https://www.apple.com"
    key: tiles
    map: *arefmap

  # Refurb accessories is sparse today (just HomePods, watched above) — this
  # source baselines it and pings when a NEW non-HomePod accessory appears.
  apple_refurb_accessories:
    type: embedded_json
    bot: apple
    notify: changes
    url: "https://www.apple.com/au/shop/refurbished/accessories"
    base_url: "https://www.apple.com"
    key: tiles
    map: *arefmap
    filter: [{field: title, op: not_contains, value: [HomePod]}]

  # --- eBay search: Leica M6 on ebay.com.au -> "ebay" bot, alert on changes ---
  leica_ebay:
    type: ebay
    bot: ebay
    dashboard: false              # tracked, but hidden from the public dashboard
    notify: changes               # new listings / removed / price changes
    watch: [price]
    query: "leica m6"
    site: au                      # ebay.com.au (AUD)
    pages: 2
    sort: newest                  # deterministic order (vs personalised Best Match) -> stable diffs
    located_in_country: true      # items located in Australia only

  # --- Facebook Marketplace: Dyson Airwrap -> "marketplace" bot, alert on changes ---
  # DISABLED on CI: Facebook serves logged-out Marketplace only to residential/mobile
  # IPs. From GitHub Actions (Azure datacenter) it redirects to /login -> 0 listings.
  # Verified working locally (Melbourne residential IP -> 24 listings). To re-enable:
  # set enabled: true, add an AU residential proxy (see proxy_env below + FB_PROXY
  # secret), and restore the schedule in .github/workflows/facebook.yml.
  dyson_marketplace:
    type: facebook
    bot: marketplace
    dashboard: false              # tracked, but hidden from the public dashboard
    enabled: false                # needs an AU residential proxy to run on CI (see note above)
    notify: changes
    watch: [price]
    query: "dyson airwrap"
    city: melbourne               # Melbourne 3000 (slug only; results IP-geolocated when logged out)
    currency: AUD
    max_price: 1000
    limit: 40
    # proxy_env: FB_PROXY         # uncomment once an AU residential proxy secret is set

  # --- DigiDirect preloved Leica -> "leica" bot, all changes, no derive/filter ---
  leica_digidirect:
    type: browser
    bot: leica
    notify: changes
    url: "https://www.digidirect.com.au/digiseconds/preloved?brand=Leica"
    headless: true
    wait_for: ".result-wrapper"
    dismiss: 'button:has-text("Allow Cookies")'
    selectors:
      container: "div.col-md-4.col-sm-6.list-view-col"
      title: "h3.result-title"
      price: "meta[itemprop='price']@content"
      was_price: "span.price-container span.price"
      url: "a.result@href"
      image: "img[itemprop='image']@src"
      sku: "a.result@data-objectid"

# --- Sold-price comps: accumulate eBay sold listings -> rolling market value ---
# eBay only shows ~90 days of sold data, so `scrapehound comps collect` runs on a
# schedule and appends new sold points (deduped) to state/comps/<key>.jsonl. Query
# stats with `scrapehound comps stats <key>`. Filters strip accessories so the
# percentiles reflect the actual item's market value, not covers/manuals/parts.
comps:
  pokemon_heartgold:
    type: ebay
    query: "pokemon heartgold cib"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 300}            # keyless floor (cart-only ~$160-190)
      - {field: title, op: contains_any, value: [heartgold, heart gold]}
    match: >
      Pokémon HeartGold for Nintendo DS, COMPLETE IN BOX (CIB): must include the
      original box. Exclude cartridge-only / game-only / loose, case-and-manual
      only (no game), empty boxes, reproductions, and posters/inserts.

  leica_m6:
    type: ebay
    query: "leica m6"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 1500}
      - {field: title, op: contains_any, value: [m6]}  # keyless safety net (no M2/M3/M5)
    match: >
      A Leica M6 35mm film rangefinder camera body (any variant: Classic, TTL,
      0.72/0.85, Millennium, LHSA). Exclude every other Leica model (M2, M3, M4,
      M5, M7, M8, M9, M10, M11, MP, MA, CL, Q), lens-only listings, and
      accessories (cases, straps, covers, winders, grips, manuals).

  contax_t2:
    type: ebay
    query: "contax t2"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 400}
      - {field: title, op: contains_any, value: [t2]}
    match: >
      A Contax T2 35mm compact film camera (titanium silver/black/gold, T2D data-
      back variants OK). Exclude other Contax models (T3, TVS, G1, G2, S2, RTS,
      Aria), lenses, straps, cases, manuals, and parts/repair/non-working listings.

  contax_t3:
    type: ebay
    query: "contax t3"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 600}
      - {field: title, op: contains_any, value: [t3]}
    match: >
      A Contax T3 35mm compact film camera (silver/black, single/double-tooth).
      Exclude other Contax models (T2, TVS, G1, G2, S2, RTS), lenses, straps,
      cases, manuals, and parts/repair/non-working listings.

  leica_q2:
    type: ebay
    query: "leica q2"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 2500}
      - {field: title, op: contains_any, value: [q2]}
    match: >
      A standard Leica Q2 fixed-lens digital compact camera body. Exclude the Q2
      Monochrom and Q2 Reporter special editions, the original Q / Q-P / Q3, and
      accessories (cases, grips, thumb rests, straps, screen protectors, batteries).

  # A liquid item — sealed single Pokémon 151 Elite Trainer Box. Tight market,
  # lots of AU sellers. `match` isolates the standard single ETB.
  pokemon_151_etb:
    type: ebay
    query: "151 elite trainer box"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 600}            # exclude empties/opened/bundles
      - {field: price, op: lte, value: 1400}           # exclude PC variant / multipacks
      - {field: title, op: contains_any, value: ["151"]}
    match: >
      A single, factory-sealed Pokémon Scarlet & Violet 151 Elite Trainer Box
      (ETB). Exclude empty or opened boxes, "no packs/no cards" listings, booster
      bundles, multi-box lots (x2/x3/x4/x5), binder collections, the Ultra Premium
      Collection (UPC), Chinese/gift-box sets, and the Pokémon Center exclusive ETB.

  # Super-liquid: sealed Prismatic Evolutions Elite Trainer Box — huge AU turnover.
  pokemon_prismatic_etb:
    type: ebay
    query: "prismatic evolutions elite trainer box"
    site: au
    pages: 4
    filter:                                            # cheap pre-filter; `match` does the rest
      - {field: price, op: gte, value: 50}             # drop loose packs/promos/accessories
      - {field: price, op: lte, value: 600}            # drop sealed cases / booster boxes / lots
      - {field: title, op: contains_any, value: [prismatic]}
    match: >
      A single, factory-sealed Pokémon Scarlet & Violet Prismatic Evolutions Elite
      Trainer Box (ETB). Exclude empty or opened boxes, booster bundles, booster
      boxes, binder collections, surprise/mystery boxes, multi-box lots, sealed
      cases, the Pokémon Center ETB variant, and single packs/promos/accessories.
