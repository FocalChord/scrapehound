[project]
name = "scrapehound"
version = "0.1.0"
description = "Generic multi-source product scraper with per-source Telegram alerting"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "selectolax>=0.4",
    "patchright>=1.40",
    "tenacity>=8.2",
    "extruct>=0.16",
    "python-dotenv>=1.0",
    "curl_cffi>=0.7",
]

[project.scripts]
scrapehound = "scrapehound.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapehound"]
