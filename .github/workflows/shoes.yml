name: shoes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shoes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Browser deps (New Balance / BHD use headful Chrome)
        run: |
          uv run patchright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run
        env:
          SHOES_BOT_TOKEN: ${{ secrets.SHOES_BOT_TOKEN }}
          SHOES_CHAT_ID: ${{ secrets.SHOES_CHAT_ID }}
        run: xvfb-run -a uv run scrapehound --bot shoes
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "update shoes state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours -q origin main || true
            git push && exit 0
            sleep $((RANDOM % 6 + 3))
          done
          echo "state push raced out; next run will persist"; exit 0
