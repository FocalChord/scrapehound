name: leica

on:
  schedule:
    - cron: "*/10 * * * *"   # preloved cameras sell fast
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: leica
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run patchright install --with-deps chromium
      - name: Run
        env:
          LEICA_BOT_TOKEN: ${{ secrets.LEICA_BOT_TOKEN }}
          LEICA_CHAT_ID: ${{ secrets.LEICA_CHAT_ID }}
        run: uv run scrapehound --bot leica
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || { git commit -m "update leica state [skip ci]"; git pull --rebase -q; git push; }
