name: ebay

on:
  schedule:
    - cron: "*/30 * * * *"   # eBay search listings; modest cadence vs Akamai
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ebay
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # eBay adapter is HTTP-only (curl_cffi) — no browser install needed.
      - name: Run
        env:
          EBAY_BOT_TOKEN: ${{ secrets.EBAY_BOT_TOKEN }}
          EBAY_CHAT_ID: ${{ secrets.EBAY_CHAT_ID }}
        run: uv run scrapehound --bot ebay
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "update ebay state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours -q origin main || true
            git push && exit 0
            sleep $((RANDOM % 6 + 3))
          done
          echo "state push raced out; next run will persist"; exit 0
