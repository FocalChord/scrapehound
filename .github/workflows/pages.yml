name: pages

on:
  workflow_run:                       # rebuild after each scrape commits fresh state
    workflows: [shoes, leica, apple]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/scrapehound/dashboard.py", ".github/workflows/pages.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run scrapehound dashboard --out _site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=scrapehound --branch=main
